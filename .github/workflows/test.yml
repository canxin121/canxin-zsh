name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git shellcheck zsh

      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Check shell syntax
        run: |
          bash -n install.sh bin/zsh-doctor tests/test-install.sh
          for file in home/.zprofile home/.zshrc home/.p10k.zsh zsh/rc/common.zsh; do
            zsh -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck install.sh bin/zsh-doctor tests/test-install.sh

      - name: Run isolated installer tests
        run: bash tests/test-install.sh

      - name: Run real dependency installation smoke test
        env:
          TEST_HOME: ${{ runner.temp }}/canxin-zsh-real-home
        run: |
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          trap 'rm -rf "$TEST_HOME"' EXIT
          HOME="$TEST_HOME" ZDOTDIR="$TEST_HOME" ./install.sh
          test -r "$TEST_HOME/.zshrc"
          test -r "$TEST_HOME/.zprofile"
          test -r "$TEST_HOME/.oh-my-zsh/oh-my-zsh.sh"
          env -u FPATH HOME="$TEST_HOME" ZDOTDIR="$TEST_HOME" zsh -d -i -c '(( $+functions[omz] ))'

  windows-msys2:
    name: windows-msys2
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PowerShell forwarding script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Install MSYS2 zsh toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            diffutils
            git
            zsh
            curl

      - name: Check syntax and run isolated tests
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash -n install.sh bin/zsh-doctor tests/test-install.sh
          for file in home/.zprofile home/.zshrc home/.p10k.zsh zsh/rc/common.zsh; do
            zsh -n "$file"
          done
          # ShellCheck is not packaged in the MSYS2 repositories; it runs in
          # both Linux and macOS jobs above. Windows still runs all zsh/bash
          # syntax and installer integration tests here.
          bash tests/test-install.sh

      - name: Run real dependency installation smoke test
        shell: msys2 {0}
        env:
          TEST_HOME: /tmp/canxin-zsh-real-home
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          trap 'rm -rf "$TEST_HOME"' EXIT
          HOME="$TEST_HOME" ZDOTDIR="$TEST_HOME" ./install.sh
          test -r "$TEST_HOME/.zshrc"
          test -r "$TEST_HOME/.zprofile"
          test -r "$TEST_HOME/.oh-my-zsh/oh-my-zsh.sh"
          env -u FPATH HOME="$TEST_HOME" ZDOTDIR="$TEST_HOME" zsh -d -i -c '(( $+functions[omz] ))'

  published-bootstrap:
    name: published-bootstrap
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Install bootstrap test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zsh curl

      - name: Test the published one-line installer
        env:
          TEST_HOME: ${{ runner.temp }}/canxin-zsh-published-home
        run: |
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          trap 'rm -rf "$TEST_HOME"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/canxin121/canxin-zsh/${GITHUB_SHA}/install.sh" |
            HOME="$TEST_HOME" ZDOTDIR="$TEST_HOME" XDG_CONFIG_HOME="$TEST_HOME/.config" \
            XDG_DATA_HOME="$TEST_HOME/.local/share" ZSH_DOTFILES_SKIP_DEPENDENCIES=1 bash
          test -r "$TEST_HOME/.zshrc"
          test -r "$TEST_HOME/.zprofile"
          test -r "$TEST_HOME/.local/share/canxin-zsh/home/.zshrc"
